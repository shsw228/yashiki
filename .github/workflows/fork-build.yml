# fork 専用。upstream には送らない。
#
# local/integration（upstream への PR 3 本をまとめたブランチ）から
# Yashiki-fork.app を作り、不変タグ fork-v<version> で publish する。
# shsw228/homebrew-tap の workflow がこれを拾って cask を更新し、
# dotfiles は brew 経由で入れる。
#
# タグを可変にしないのは cask が sha256 を固定するため。上流の version に
# run_number を足して単調増加させる（同じ上流版を作り直しても衝突しない）。
#
# cask 版と共存させるため bundle ID を dev.typester.yashiki.fork にする。
# macOS のアクセシビリティ許可は bundle ID 単位なので、これで両方に別々の
# 許可を与えられる。
#
# 署名は必須にしてある。アドホック署名だとビルドごとに cdhash が変わり、
# 入れ替えるたびにアクセシビリティ許可が外れて実用にならないため、
# 証明書が無い場合は黙ってアドホックに落とさず失敗させる。
name: Fork build

on:
  push:
    branches: [local/integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yashiki-fork.app
    # upstream に混ざっても走らないようにする
    if: github.repository == 'shsw228/yashiki'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${CERTIFICATE_P12}" ]; then
            echo "::error::CERTIFICATE_P12 secret is not set." \
                 "An ad-hoc signed build would lose its Accessibility grant on every update," \
                 "so this workflow refuses to produce one."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # 証明書の CN に依存せず、鍵の SHA-1 を identity として使う。
          # codesign はハッシュ指定を受け付けるので、証明書を差し替えても
          # ワークフローを直す必要がない。
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk 'NR==1 {print $2}')"
          if [ -z "${IDENTITY}" ]; then
            echo "::error::no codesigning identity found in the imported keychain"
            exit 1
          fi
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"

      # designated requirement を証明書の CN ではなくチーム ID で固定する。
      # 既定では codesign が leaf の CN を焼き込むため、証明書を更新すると別の
      # コード識別子になり、macOS が覚えたアクセシビリティ許可が失効する。
      # チーム ID なら同じチームの証明書に入れ替えても許可が続く。
      - name: Build .app bundle
        env:
          APP_BASENAME: Yashiki-fork
          BUNDLE_ID: dev.typester.yashiki.fork
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          CODESIGN_REQUIREMENTS: >-
            designated => anchor apple generic
            and certificate 1[field.1.2.840.113635.100.6.2.1]
            and certificate leaf[subject.OU] = "3S7EA557V7"
        run: ./scripts/build-app.sh --target aarch64-apple-darwin --release

      - name: Verify signature and designated requirement
        run: |
          set -euo pipefail
          APP=target/Yashiki-fork.app
          codesign -dv "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q "^Identifier=dev.typester.yashiki.fork$" /tmp/codesign.txt
          # アドホック署名には TeamIdentifier が付かない
          if grep -q "^TeamIdentifier=not set$" /tmp/codesign.txt; then
            echo "::error::bundle is ad-hoc signed; refusing to publish"
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
          # DR がチーム ID で固定されていること。CN が焼き込まれていると
          # 次に証明書を更新したときアクセシビリティ許可が失効する。
          printf '%s\n' 'anchor apple generic and certificate leaf[subject.OU] = "3S7EA557V7"' \
            > /tmp/req-team.txt
          codesign --verify -R /tmp/req-team.txt "$APP"
          if codesign -d --requirements - "$APP" 2>&1 | grep -q "subject.CN"; then
            echo "::error::designated requirement still pins the certificate CN"
            exit 1
          fi

      # cask が参照するのでアセット名も fork の version に揃える。
      - name: Determine the fork version
        id: info
        run: |
          set -euo pipefail
          UPSTREAM="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          FORK_VERSION="${UPSTREAM}.${GITHUB_RUN_NUMBER}"
          mv "target/Yashiki-fork-arm64-${UPSTREAM}.zip" \
             "target/Yashiki-fork-arm64-${FORK_VERSION}.zip"
          echo "version=${FORK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "fork version: ${FORK_VERSION}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-v${{ steps.info.outputs.version }}
          name: Yashiki-fork ${{ steps.info.outputs.version }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: target/Yashiki-fork-arm64-${{ steps.info.outputs.version }}.zip
